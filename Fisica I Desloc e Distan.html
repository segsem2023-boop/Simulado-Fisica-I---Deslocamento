<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado de Física - Etec Heliópolis</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #c0392b;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--primary); margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        
        .header { text-align: center; border-bottom: 3px solid var(--accent); margin-bottom: 30px; padding-bottom: 20px; }
        .header h1 { margin: 5px 0; font-size: 1.8rem; }
        .header h2 { margin: 0; color: var(--accent); font-size: 1.1rem; text-transform: uppercase; }
        
        .question-card { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .options { display: grid; gap: 8px; margin-top: 15px; }
        .option-btn { 
            background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 6px; 
            cursor: pointer; text-align: left; transition: 0.2s;
        }
        .option-btn:hover { border-color: #3498db; background: #f0f8ff; }
        .option-btn.correct { background: var(--success) !important; color: white; }
        .option-btn.wrong { background: var(--error) !important; color: white; }

        .score-board { position: sticky; top: 10px; background: var(--primary); color: white; padding: 15px; border-radius: 8px; text-align: center; z-index: 100; margin-bottom: 20px; }
        .explanation { display: none; margin-top: 10px; padding: 10px; border-left: 4px solid #3498db; background: #eef7ff; font-size: 0.9rem; }

        /* Estilo do Certificado */
        #certificate { 
            display: none; margin-top: 30px; padding: 40px; border: 10px double var(--primary); 
            text-align: center; background: #fff; position: relative;
        }
        #certificate h2 { font-family: 'Georgia', serif; color: var(--accent); font-size: 2.5rem; }
        .cert-body { font-size: 1.2rem; line-height: 1.8; }
        .btn-print { background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="score-board">
        <span id="score-text">Questões respondidas: 0 / 10</span>
    </div>

    <div class="header">
        <h2>Etec Heliópolis</h2>
        <h1>Simulado: Distância e Deslocamento</h1>
        <p>Professor Responsável: <strong>Cesar Augusto</strong></p>
    </div>

    <div id="quiz-container"></div>

    <div id="final-area" style="text-align:center; display:none;">
        <button class="btn-print" onclick="generateCertificate()">Gerar Meu Certificado</button>
    </div>

    <div id="certificate">
        <h2>Certificado de Desempenho</h2>
        <div class="cert-body">
            <p>Certificamos que o aluno(a) completou o simulado de física da <strong>Etec Heliópolis</strong>.</p>
            <p>Pontuação Final: <strong id="final-score"></strong></p>
            <p id="congrats-msg" style="font-weight: bold; color: var(--success);"></p>
            <hr style="width: 50%; margin: 40px auto;">
            <p>Orientação: Prof. Cesar Augusto</p>
        </div>
        <button class="btn-print" onclick="window.print()">Imprimir ou Salvar PDF</button>
    </div>
</div>

<script>
    const questions = [
        { q: "1. Pedestre caminha 50m para a direita e 20m na mesma direção. Distância?", options: ["30m", "50m", "70m", "0m"], correct: 2, exp: "Soma direta: 50 + 20 = 70m." },
        { q: "2. Carro vai do km 20 ao 100 e volta ao 80. Deslocamento?", options: ["160km", "60km", "80km", "100km"], correct: 1, exp: "Sfinal - Sinicial = 80 - 20 = 60km." },
        { q: "3. Formiga sobe 3m e desce 3m. Distância e Deslocamento?", options: ["3m e 0m", "6m e 6m", "6m e 0m", "0m e 6m"], correct: 2, exp: "Distância total 6m. Voltou ao início, então deslocamento 0." },
        { q: "4. Atleta vai de 10m a 50m e volta para 0m. Módulo do deslocamento?", options: ["90m", "10m", "50m", "40m"], correct: 1, exp: "|0 - 10| = 10m." },
        { q: "5. Robô move 8m Norte e 6m Oeste. Módulo do deslocamento?", options: ["14m", "10m", "2m", "48m"], correct: 1, exp: "Teorema de Pitágoras: √(8² + 6²) = 10m." },
        { q: "6. Uma volta completa circular (Raio 5m, π=3). Distância?", options: ["0m", "15m", "30m", "10m"], correct: 2, exp: "C = 2 * 3 * 5 = 30m." },
        { q: "7. Deslocamento após uma volta completa circular?", options: ["0m", "30m", "10m", "5m"], correct: 0, exp: "Posição final = Posição inicial. ΔS = 0." },
        { q: "8. Nadador atravessa 20m e volta 10m. Distância e Deslocamento?", options: ["30m e 30m", "20m e 10m", "30m e 10m", "40m e 0m"], correct: 2, exp: "20+10=30m. Distância da origem = 10m." },
        { q: "9. Meia volta circular (Raio 10m). Módulo do deslocamento?", options: ["31,4m", "20m", "10m", "0m"], correct: 1, exp: "Deslocamento é o diâmetro (2 * R) = 20m." },
        { q: "10. Helicóptero: 12km Sul, 5km Leste. Diferença Distância-Deslocamento?", options: ["17km", "13km", "4km", "7km"], correct: 2, exp: "Distância (17) - Deslocamento (13) = 4km." }
    ];

    let score = 0;
    let answered = 0;

    function renderQuiz() {
        const container = document.getElementById('quiz-container');
        questions.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <strong>${item.q}</strong>
                <div class="options" id="opt-${idx}">
                    ${item.options.map((opt, oIdx) => `<button class="option-btn" onclick="check(${idx}, ${oIdx}, this)">${opt}</button>`).join('')}
                </div>
                <div id="exp-${idx}" class="explanation"><strong>Resolução:</strong> ${item.exp}</div>
            `;
            container.appendChild(card);
        });
    }

    function check(qIdx, oIdx, btn) {
        const parent = document.getElementById(`opt-${qIdx}`);
        if (parent.classList.contains('done')) return;
        parent.classList.add('done');
        
        if (oIdx === questions[qIdx].correct) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong');
            parent.querySelectorAll('.option-btn')[questions[qIdx].correct].classList.add('correct');
        }
        
        document.getElementById(`exp-${qIdx}`).style.display = 'block';
        answered++;
        document.getElementById('score-text').innerText = `Questões respondidas: ${answered} / 10`;
        
        if (answered === 10) document.getElementById('final-area').style.display = 'block';
    }

    function generateCertificate() {
        document.getElementById('final-area').style.display = 'none';
        document.getElementById('certificate').style.display = 'block';
        document.getElementById('final-score').innerText = `${score} de 10 acertos`;
        
        let msg = "";
        if (score === 10) msg = "Incrível! Você demonstrou domínio total e um esforço exemplar. Parabéns pela excelência!";
        else if (score >= 7) msg = "Muito bem! Seu esforço valeu a pena e você está no caminho certo para o sucesso.";
        else msg = "Parabéns pela conclusão! O esforço é o primeiro passo para o aprendizado. Continue revisando!";
        
        document.getElementById('congrats-msg').innerText = msg;
        window.scrollTo(0, document.body.scrollHeight);
    }

    renderQuiz();
</script>
</body>
</html>
